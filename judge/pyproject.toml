[project]
name = "oj-judge-node"
version = "0.1.0"
description = "OJ 判题节点（nsjail 沙箱 + gRPC 客户端，运行于 Linux 容器）"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.83",
    "protobuf>=7.36",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["judge_node"]
