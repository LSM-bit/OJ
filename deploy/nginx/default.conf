#     listen 443 ssl;
#     server_name 你的域名;
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     # ...上面 80 server 内的全部 location 原样复制...
#     # 并将 /oj/api/ 的 proxy_set_header X-Forwarded-Proto 改为 https
# }
