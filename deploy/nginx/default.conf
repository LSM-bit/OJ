# OJ 站点 nginx 配置（web 容器内，全站唯一公网入口 :80）
# 子路径部署：站点对外统一挂在 /oj/ 下（原占根路径，已迁到子路径；其它项目各自占自己的子路径）
#   - 静态：前端 dist 挂在 /usr/share/nginx/html/oj/（目录名与 URL 前缀一致，SPA 回退无需 alias/rewrite）
#   - API ：/oj/api/xxx → http://api:8000/xxx（前缀剥离，后端代码与路由零改动）
#   - 旧链接：原根路径下的地址整体 302 到 /oj/ 下，避免书签/外链失效
server {
    listen 80;
    server_name _;   # 生产改为你的域名；上 HTTPS 后另加 443 server 块（见文末预留）

    # 重定向一律用相对 Location（/oj/...）：端口/域名变化、反代场景下都不会跳错地址
    absolute_redirect off;

    # 上传上限：后端 64MB 校验（api/app/routers/problems.py），留余量
    client_max_body_size 70m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 子路径入口补斜杠：/oj → /oj/
    location = /oj {
        return 302 /oj/;
    }

    # Vite 产物带内容哈希，可长缓存
    location /oj/assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 同源反代：/oj/api/xxx → http://api:8000/xxx（注意末尾斜杠负责剥离前缀）
    location /oj/api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 三要素（AI 助手逐字流式输出）：关缓冲 + 1.1 长连 + 长超时
        # （LLM 工具往返可能静默数分钟，默认 60s 必 504）
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # SPA history 回退：/oj/problems 等前端路由（磁盘上无对应文件）回 /oj/index.html
    location /oj/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /oj/index.html;
    }

    # 旧链接兼容：原根路径下的地址（/、/problems/123、/assets/*.js、/favicon.svg …）
    # 整体 302 到 /oj/ 同路径下，保留路径与查询串
    location / {
        return 302 /oj$request_uri;
    }
}

# ============ HTTPS 预留（生产建议尽快启用）============
