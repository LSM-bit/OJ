# OJ 站点 nginx 配置（web 容器内，全站唯一公网入口 :80）
# 静态托管前端 dist + 同源反代 /api/ → api:8000（前缀剥离，后端零改动）
server {
    listen 80;
    server_name _;   # 生产改为你的域名；上 HTTPS 后另加 443 server 块（见文末预留）

    # 上传上限：后端 64MB 校验（api/app/routers/problems.py），留余量
    client_max_body_size 70m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Vite 产物带内容哈希，可长缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 同源反代：/api/xxx → http://api:8000/xxx
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 三要素（AI 助手逐字流式输出）：关缓冲 + 1.1 长连 + 长超时
        # （LLM 工具往返可能静默数分钟，默认 60s 必 504）
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # SPA history 路由回退：/problems 等前端路由 404 时回 index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

# ============ HTTPS 预留（生产建议尽快启用）============
