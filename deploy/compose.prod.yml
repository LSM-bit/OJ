# OJ 生产部署 override：在 base（docker-compose.yml）之上追加 api/web 容器
# 用法（服务器）: docker compose -f docker-compose.yml -f compose.prod.yml up -d --build
# compose 合并规则备忘：environment 映射按 key 覆盖（节点 SERVER_ADDRESS 被本文件
# 覆盖为 api 服务名），ports/env_file 列表拼接；api 不发布任何端口——对外只有 web 的 80
#
# 容器命名约定（2026-09 起）：
#   项目专属服务 web / api / judge-node / assistant-node 统一显式命名 deploy-oj-<服务名>，
#   与可复用基础设施区分开（postgres / redis / minio 不设 container_name，仍随 project 前缀
#   生成为 deploy-postgres-1 / deploy-redis-1 / deploy-minio-1，供其他项目共用同一套数据卷）。
#   web/api 只存在于本 override，故名称写在这里；judge-node/assistant-node 在 base 中即存在，
#   名称定义在 docker-compose.yml（dev/prod 同一个名字），生产不再重复声明。
#   影响：显式 container_name 是全局唯一名、不再带 project 前缀，本机若再用 `-p ojprod`
#   起第二套栈会重名冲突（详见 docs/服务器部署手册.md §8.5）。
services:
  api:
    container_name: deploy-oj-api
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file:
      - api.env          # DATABASE_URL / MINIO_* / JWT_SECRET / 节点令牌 / ADMIN_*
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ojnet]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

  web:
    container_name: deploy-oj-web
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_BASE: /oj/api   # 前端 API 前缀（nginx 剥离 /oj/api/ 后转 api:8000）
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [ojnet]
    restart: unless-stopped
    healthcheck:
      # 站点入口是子路径 /oj/（根路径 302 跳 /oj/，wget 会跟随重定向，这里直接打子路径更精确）
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/oj/"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  # 生产：节点直连 api 容器的 gRPC 网关 + Redis Stream
  judge-node:
    environment:
      SERVER_ADDRESS: api:50051
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.50'

  assistant-node:
    environment:
      SERVER_ADDRESS: api:50060
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
