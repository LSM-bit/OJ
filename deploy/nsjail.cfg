# nsjail 沙箱配置：判题进程最小权限
# 根目录默认 R/O；作业目录经命令行 -R 参数动态挂为可写
name: "oj-judge"
mode: ONCE

mount_proc: true
mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
}
mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
}
mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
}
mount {
  src: "/bin"
  dst: "/bin"
  is_bind: true
}
mount {
  src: "/sbin"
  dst: "/sbin"
  is_bind: true
}
mount {
  src: "/etc/alternatives"
  dst: "/etc/alternatives"
  is_bind: true
}

# 资源限制（运行时由命令行动态覆盖 rlimit_as/fsize/nproc/time）
rlimit_as_type: SOFT
rlimit_cpu_type: SOFT
rlimit_fsize_type: SOFT
rlimit_nofile_type: SOFT
rlimit_nproc_type: SOFT
time_limit: 10

# 隔离：网络/用户/挂载/PID/IPC/UTS 全部独立 namespace
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true

# 非 root 运行（nobody）
uidmap {
  inside_id: "65534"
  outside_id: ""
}
gidmap {
  inside_id: "65534"
  outside_id: ""
}
