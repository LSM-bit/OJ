# OJ 开发环境编排（base）：postgres / redis / minio / judge-node / assistant-node
# api 在宿主机 venv 跑（HTTP :8000 + 内嵌 gRPC :50051/:50060），节点经 host.docker.internal 外连
# 生产部署 = 本文件 + compose.prod.yml（override 追加 api/web 容器、节点改连 api 服务名），
# 服务器上只用: docker compose -f docker-compose.yml -f compose.prod.yml up -d
# 注意: compose 的 environment 优先级高于 env_file，密钥一律走 env_file 注入（api.env / judge-node.env / .env）
#
# 容器命名约定（2026-09 起）：
#   项目专属服务 web / api / judge-node / assistant-node 统一显式命名 deploy-oj-<服务名>；
#   可复用基础设施 postgres / redis / minio 不设 container_name，保留自动名 deploy-<服务>-1。
#   judge-node / assistant-node 在 base 中已存在，故名称在此定义（dev/prod 同名）；
#   web / api 只存在于 compose.prod.yml，其 container_name 写在那个文件里。
#   显式名不带 project 前缀且全局唯一：本机 `-p ojprod` 并行起第二套栈会重名冲突，
#   需先停掉另一套（详见 docs/环境搭建记录.md、docs/服务器部署手册.md §8.5）。
services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - api.env          # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    ports:
      - "127.0.0.1:5432:5432"   # 仅宿主机本机调试；生产不对外
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [ojnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 2G 服务器内存限制 + PostgreSQL 内存优化（防止 OOM）
    shm_size: 64mb
    command: >
      postgres
        -c shared_buffers=64MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c effective_cache_size=128MB
        -c max_connections=30
        -c wal_buffers=4MB
        -c min_wal_size=40MB
        -c max_wal_size=128MB
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

  redis:
    image: redis:7-alpine
    # 2G 服务器内存限制 + LRU 淘汰策略（内存满时自动驱逐旧 key）
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    networks: [ojnet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 80M
          cpus: '0.25'

  # MinIO 对象存储：题目测试数据（oj-problems）+ 用户头像（oj-avatars）
  # 镜像源说明：MinIO 已于 2026-09 删除 Docker Hub 上的 minio/minio —— 官方名
  # minio/minio:latest 必定 denied，配镜像加速器也没用（加速器只是转发 docker.io，
  # 上游仓库已 404）。改用官方上游 quay.io（本机与服务器实测均可直连且 digest 一致）；
  # 若某网络拉不动，备选代理缓存：docker.1ms.run/minio/minio:latest 或
  # docker.m.daocloud.io/minio/minio:latest（改下面 image 行即可）
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - api.env          # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
    ports:
      - "127.0.0.1:9000:9000"   # S3 API（仅宿主机本机调试）
      - "127.0.0.1:9001:9001"   # Web Console（仅宿主机本机调试）
    volumes:
      - miniodata:/data
    networks: [ojnet]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: '0.25'

  # 判题节点（nsjail 沙箱，主动外连 API 网关 gRPC；dev 形态连宿主机 API）
  # 架构变化：节点从 Redis Stream 拉取任务（不再通过 gRPC 推送）
  judge-node:
    container_name: deploy-oj-judge-node
    build:
      context: ..
      dockerfile: deploy/judge-node.Dockerfile
    env_file:
      - judge-node.env  # SERVER_TOKEN（与 api 侧 JUDGE_GATEWAY_TOKENS[0] 一致；dev 值 dev-judge-token）
    environment:
      SERVER_ADDRESS: "host.docker.internal:50051"
      REDIS_URL: "redis://redis:6379/0"   # Redis Stream 连接地址
    # Linux 上 Docker 引擎（非 Desktop）不解析 host.docker.internal，加映射指向宿主机
    # host-gateway 是 Docker 20.10+ 内置关键字（自动解析为宿主机 IP）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    privileged: true
    networks: [ojnet]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.50'

  # AI 助手节点（LLM 中转，外连 API 助手网关 gRPC :50060；无沙箱需求，非 privileged）
  # ANTHROPIC_API_KEY / ANTHROPIC_BASE_URL / SERVER_TOKEN 经 env_file 从 deploy/.env 注入，
  # 绝不写死进 compose/git；.env 已被 gitignore
  assistant-node:
    container_name: deploy-oj-assistant-node
    build:
      context: ..
      dockerfile: deploy/assistant-node.Dockerfile
    # key/端点经 env_file 直接从 deploy/.env 注入——compose 的 ${VAR} 插值会被
    # 宿主 shell 同名变量抢先（实测 ANTHROPIC_BASE_URL 被外部代理端点覆盖致 401），
    # env_file 则完全绕开宿主环境
    env_file:
      - .env             # ANTHROPIC_API_KEY / ANTHROPIC_BASE_URL / SERVER_TOKEN
    environment:
      SERVER_ADDRESS: "host.docker.internal:50060"
      # ASSISTANT_MOCK: "1"   # 联调/CI：不联网走 mock 回显
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ojnet]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

networks:
  ojnet:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
