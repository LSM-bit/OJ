# OJ 开发环境编排：postgres / redis / go-judge 沙箱
# api 与 judge 本地直接跑（python venv），生产阶段再容器化
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oj
      POSTGRES_PASSWORD: oj_password
      POSTGRES_DB: oj
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oj"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO 对象存储：题目测试数据（oj-problems）+ 用户头像（oj-avatars）
  minio:
    image: docker.1ms.run/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oju      # MinIO 要求用户名 ≥3 字符
      MINIO_ROOT_PASSWORD: oj_password
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 判题节点（nsjail 沙箱，主动外连 API 网关 gRPC）
  judge-node:
    build:
      context: ..
      dockerfile: deploy/judge-node.Dockerfile
    environment:
      SERVER_ADDRESS: "host.docker.internal:50051"
      SERVER_TOKEN: "dev-judge-token"
    privileged: true
    restart: unless-stopped

  # AI 助手节点（LLM 中转，外连 API 助手网关 gRPC :50060；无沙箱需求，非 privileged）
  # ANTHROPIC_API_KEY / ANTHROPIC_BASE_URL 从宿主 deploy/.env 注入，绝不写死进 compose/git
  assistant-node:
    build:
      context: ..
      dockerfile: deploy/assistant-node.Dockerfile
    # key/端点经 env_file 直接从 deploy/.env 注入——compose 的 ${VAR} 插值会被
    # 宿主 shell 同名变量抢先（实测 ANTHROPIC_BASE_URL 被外部代理端点覆盖致 401），
    # env_file 则完全绕开宿主环境；.env 已被 gitignore，绝不入库
    env_file:
      - .env
    environment:
      SERVER_ADDRESS: "host.docker.internal:50060"
      SERVER_TOKEN: "dev-assistant-token"
      # ASSISTANT_MOCK: "1"   # 联调/CI：不联网走 mock 回显
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
